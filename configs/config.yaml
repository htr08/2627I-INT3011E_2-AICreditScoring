# Cấu hình dùng chung cho toàn dự án.
# Gồm: chia dữ liệu, MLflow, tuning, nhóm đặc trưng, calibration và ngưỡng vận hành, ma trận chi phí, phân tầng rủi ro, PDO.

random_state: 42

data:
  raw_path: data/raw/UCI_Credit_Card.csv
  target_col: default.payment.next.month
  splits_dir: data/splits
  train_ratio: 0.6
  valid_ratio: 0.2
  test_ratio: 0.2

mlflow:
  # Đường dẫn tương đối tính từ thư mục gốc repo (không phụ thuộc thư mục đang chạy).
  # Có thể ghi đè bằng biến môi trường MLFLOW_TRACKING_URI (vd: server dùng chung của nhóm).
  tracking_dir: mlruns
  experiment_name: credit_scoring

# Tuning Optuna (Tuần 2 – T4). Điều kiện dừng theo Project Charter mục 1.3:
# dừng khi CV ROC-AUC không cải thiện quá min_delta sau `patience` trial liên tiếp,
# hoặc hết ngân sách timeout_seconds (2 giờ) cho mỗi mô hình.
tuning:
  n_splits: 5
  patience: 30
  min_delta: 0.002
  timeout_seconds: 7200
  max_trials: 500           # chặn trên an toàn, điều kiện dừng chính là patience/timeout
  pruner_startup_trials: 10
  pruner_warmup_folds: 2
  # Biến numeric ràng buộc đơn điệu tăng theo rủi ro (biến trễ hạn và tỷ lệ sử dụng hạn mức).
  # PAY_1..PAY_6 được one-hot theo feature freeze v1 nên không áp dụng được ràng buộc.
  monotone_increasing: [PAY_MEAN, PAY_MAX, PAY_LATE_CONSECUTIVE, PAY_LATE_2PLUS_COUNT,
                        UTIL_1, UTIL_2, UTIL_3, UTIL_4, UTIL_5, UTIL_6, UTIL_MEAN]

# Nhóm đặc trưng dùng cho reason codes và so sánh đồng thuận giữa các mô hình
# (project_plan.md mục 3.5e). Khóa là tên biến gốc (trước one-hot), mỗi biến thuộc đúng một nhóm.
# Phải khớp với configs/feature_freeze_v1.yaml (kiểm tra bằng src.explain.check_groups_cover).
feature_groups:
  lich_su_tre_han:
    label: Lịch sử trễ hạn
    variables: [PAY_1, PAY_2, PAY_3, PAY_4, PAY_5, PAY_6, PAY_MAX, PAY_MEAN, PAY_SLOPE,
                PAY_LATE_CONSECUTIVE, PAY_LATE_2PLUS_COUNT]
  muc_su_dung_han_muc:
    label: Mức sử dụng hạn mức
    variables: [LIMIT_BAL, UTIL_1, UTIL_2, UTIL_3, UTIL_4, UTIL_5, UTIL_6, UTIL_MEAN]
  hanh_vi_tra_no:
    label: Hành vi trả nợ
    variables: [PAY_AMT1, PAY_AMT2, PAY_AMT3, PAY_AMT4, PAY_AMT5, PAY_AMT6,
                PAY_RATIO_1, PAY_RATIO_2, PAY_RATIO_3, PAY_RATIO_4, PAY_RATIO_5, PAY_RATIO_MEAN,
                MIN_PAY_FLAG_1, MIN_PAY_FLAG_2, MIN_PAY_FLAG_3, MIN_PAY_FLAG_4, MIN_PAY_FLAG_5,
                MIN_PAY_FLAG_6, MIN_PAY_FLAG_COUNT]
  bien_dong_du_no:
    label: Dư nợ và biến động dư nợ
    variables: [BILL_AMT1, BILL_AMT2, BILL_AMT3, BILL_AMT4, BILL_AMT5, BILL_AMT6, BILL_STD, BILL_DELTA]
  nhan_khau_hoc:
    label: Nhân khẩu học
    variables: [AGE_BIN, EDUCATION, MARRIAGE]

# Calibration trên tập Valid (Tuần 3 – T2, project_plan.md mục 3.5e & 4.3).
# Ưu tiên Platt scaling (fit tay trên output_margin) để bảo toàn tính cộng tính của SHAP.
calibration:
  method: platt             # 'platt' hoặc 'isotonic'
  val_split: valid
  n_bins: 10
  # Ngưỡng PD vận hành đã khóa trước khi đánh giá Test (Tuần 3 – T3): làm tròn từ trung bình OOF EAD-weighted
  # 0.088 (reports/calibration_threshold.md mục 4.5). Mô hình lưu ở models/final_model.pkl dùng ngưỡng này.
  threshold: 0.09

# Ma trận chi phí (Project Charter mục 1.3 & 7).
# Chi phí FN ≈ LGD * EAD (LGD = 0.45); Chi phí FP ≈ 5% * EAD (0.05).
# Tỷ lệ chi phí chuẩn FN:FP = 9:1; khảo sát độ nhạy từ 3:1 đến 10:1.
cost_matrix:
  cost_fn: 0.45
  cost_fp: 0.05
  lgd: 0.45
  lost_revenue_rate: 0.05
  fn_fp_ratios: [3.0, 5.0, 7.0, 9.0, 10.0]

# Phân tầng rủi ro cho demo (reports/calibration_threshold.md mục 6.3). Ranh giới dưới là calibration.threshold
# (ngưỡng vận hành đã khóa); ranh giới trên là ngưỡng tối ưu khi tỷ lệ chi phí FN:FP = 3:1.
risk_tiers:
  alert_threshold: 0.27

# Quy đổi PD sang điểm tín dụng theo PDO (Project Charter mục 1.3 & project_plan.md mục 3.5d).
# Base Score = 600 tại odds 50:1, PDO = 20, thang hiển thị [300, 850].
scoring:
  base_score: 600
  base_odds: 50.0
  pdo: 20.0
  clip_min: 300
  clip_max: 850
